<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>상속세 위임계약서 생성기 — 원제우세무사사무소 (내부용)</title>
<style>
:root{--g:#2E7D4F;--g2:#3E9463;--bg:#f4f7f5;--card:#fff;--line:#d8e6dc;--ink:#26241f;--ink2:#5a6472;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.65;}
.top{background:var(--g);color:#fff;padding:14px 20px;}
.top b{font-size:16px;} .top span{font-size:12px;opacity:.75;margin-left:10px;}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
.card h2{font-size:16px;color:var(--g);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--g);}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.row label{min-width:150px;font-weight:600;font-size:13.5px;}
input[type=text],input[type=date],input[type=number]{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;}
input:focus{outline:none;border-color:var(--g);}
.hint{font-size:12px;color:var(--ink2);}
.heir-row{display:grid;grid-template-columns:1.2fr 1fr 1.1fr 1.4fr 34px;gap:6px;margin-bottom:6px;}
.heir-row input{width:100%;font-size:13px;padding:7px 8px;}
.heir-row button{border:none;background:#eee;border-radius:6px;cursor:pointer;color:#a23b2e;font-weight:700;}
.addbtn{margin-top:4px;padding:7px 14px;border:1.5px dashed var(--g);background:#eaf4ed;color:var(--g);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.qbtn{display:block;width:100%;margin-top:14px;padding:13px;border:none;border-radius:10px;background:var(--g);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.qbtn:hover{opacity:.92;}
#sheet{display:none;}
@page{size:A4;margin:12mm 0;}
@media print{
  .top,.wrap{display:none !important;}
  #sheet{display:block;padding:2mm 17mm;font-size:11.5px;line-height:1.75;color:#222;}
  #sheet h1{text-align:center;font-size:21px;color:var(--g);margin-bottom:2px;}
  #sheet .csub{text-align:center;font-size:10px;color:#5a6472;margin-bottom:14px;}
  #sheet h3{font-size:13px;color:var(--g);margin:13px 0 4px;}
  #sheet table{width:100%;border-collapse:collapse;margin:6px 0;}
  #sheet th{background:var(--g);color:#fff;padding:6px 8px;font-size:10.5px;text-align:center;}
  #sheet td{border:1px solid #c9d8ce;padding:6px 8px;font-size:11px;}
  #sheet .pt td:first-child{background:#f0f7f2;font-weight:700;width:26mm;}
  #sheet ol{margin:2px 0 6px 22px;}
  #sheet ol li{margin-bottom:2px;}
  #sheet .acct{background:#eaf4ed;border-radius:5px;padding:6px 10px;font-weight:700;margin:4px 0;}
  #sheet .pgbrk{break-before:page;page-break-before:always;}
  #sheet .signrow{margin-top:10px;font-size:12px;}
  table,tr{break-inside:avoid;page-break-inside:avoid;}
  h3{break-after:avoid;page-break-after:avoid;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<div class="top"><b>상속세 위임계약서 생성기</b><span>원제우세무사사무소 · 내부용</span></div>
<div class="wrap">

<div class="card">
  <h2>기본 정보</h2>
  <div class="row"><label>대표상속인 성명</label><input type="text" id="rep" placeholder="홍길동" style="width:160px;"> <input type="text" id="repTel" placeholder="연락처 010-0000-0000" style="flex:1;min-width:170px;"></div>
  <div class="row"><label>피상속인 성명</label><input type="text" id="dec" placeholder="홍판서" style="width:160px;"></div>
  <div class="row"><label>상속개시일 (사망일)</label><input type="date" id="ddate"></div>
  <div class="row"><label>계약일</label><input type="date" id="cdate"></div>
</div>

<div class="card">
  <h2>보수</h2>
  <div class="row"><label>총상속재산가액</label><input type="number" id="asset" min="0" step="0.1" style="width:110px;text-align:right;" oninput="suggest()"> <span class="hint">억원 — 입력 시 기본보수·지급 구조 자동 제안</span></div>
  <div class="row"><label>보수 (부가세 별도)</label><input type="number" id="fee" min="0" style="width:130px;text-align:right;" oninput="feeInfo()"> <span class="hint">만원 — 가산 항목 반영해 수정 가능</span></div>
  <div class="hint" id="feeHint" style="margin-left:160px;"></div>
</div>

<div class="card">
  <h2>상속인 명단 (별지)</h2>
  <div class="heir-row" style="font-size:12px;font-weight:700;color:var(--ink2);"><span>성명</span><span>관계</span><span>생년월일</span><span>연락처</span><span></span></div>
  <div id="heirs"></div>
  <button class="addbtn" onclick="addHeir()">+ 상속인 추가</button>
</div>

<button class="qbtn" onclick="makeContract()">📄 계약서 PDF 저장</button>
<p class="hint" style="margin-top:8px;">인쇄 대화상자에서 "PDF로 저장"을 선택하세요. 계약서 본문 + 별지(상속인 명단·연대지급 확인서)가 함께 생성됩니다.</p>

</div>

<div id="sheet"></div>

<script>
// 쪽번호: 강제 나눔 구간(.pgseg)별 높이를 측정해 "n / 전체"를 배치
function addPageNums(sheetId, usable){
  var sheet = document.getElementById(sheetId);
  var prev = sheet.getAttribute("style") || "";
  sheet.style.cssText = "display:block;position:absolute;left:-9999px;top:0;width:210mm;";
  sheet.querySelectorAll(".pgnum").forEach(function(d){ d.remove(); });
  var segs = sheet.querySelectorAll(".pgseg");
  var counts = [], total = 0;
  segs.forEach(function(sg){
    var n = Math.max(1, Math.ceil(sg.offsetHeight / usable));
    counts.push(n); total += n;
  });
  var p = 0;
  segs.forEach(function(sg, i){
    sg.style.position = "relative";
    for (var k = 0; k < counts[i]; k++){
      p++;
      var d = document.createElement("div");
      d.className = "pgnum";
      d.style.cssText = "position:absolute;right:2mm;font-size:9px;color:#8a97a5;top:" +
        (Math.min((k+1)*usable, sg.offsetHeight) - 16) + "px;";
      d.textContent = p + " / " + total;
      sg.appendChild(d);
    }
  });
  sheet.setAttribute("style", prev);
}

function baseFee(x){
  if (x <= 0) return 0;
  if (x <= 3) return 150; if (x <= 5) return 200; if (x <= 10) return 250;
  if (x < 20) return 250 + (x - 10) * 30;
  if (x < 30) return 550 + (x - 20) * 20;
  if (x < 50) return 750 + (x - 30) * 15;
  if (x < 100) return 1050 + (x - 50) * 10;
  return null;
}
function comma(n){ return Math.round(n).toLocaleString(); }
function suggest(){
  var a = parseFloat(document.getElementById("asset").value) || 0;
  var f = baseFee(a);
  if (f !== null && f > 0){ document.getElementById("fee").value = Math.round(f); }
  feeInfo();
}
function feeInfo(){
  var f = parseFloat(document.getElementById("fee").value) || 0;
  var a = parseFloat(document.getElementById("asset").value) || 0;
  var plan = (a > 10 || baseFee(a) === null) ? "착수 30% · 중간 30% · 잔금 40%" : "착수 50% · 잔금 50%";
  document.getElementById("feeHint").textContent = f > 0
    ? "부가세 포함 " + comma(f*1.1) + "만원 · 지급 구조: " + plan
    : "";
}
function addHeir(v){
  v = v || {};
  var d = document.createElement("div");
  d.className = "heir-row";
  d.innerHTML = '<input type="text" placeholder="성명" value="'+(v.n||"")+'">' +
    '<input type="text" placeholder="예: 배우자" value="'+(v.r||"")+'">' +
    '<input type="text" placeholder="1970-01-01" value="'+(v.b||"")+'">' +
    '<input type="text" placeholder="010-" value="'+(v.t||"")+'">' +
    '<button onclick="this.parentNode.remove()">×</button>';
  document.getElementById("heirs").appendChild(d);
}
addHeir(); addHeir(); addHeir();

function fmtDate(v){
  if (!v) return "        년      월      일";
  var p = v.split("-");
  return p[0] + "년 " + parseInt(p[1]) + "월 " + parseInt(p[2]) + "일";
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function makeContract(){
  var rep = esc(document.getElementById("rep").value) || "_______________";
  var repTel = esc(document.getElementById("repTel").value) || "________________";
  var dec = esc(document.getElementById("dec").value) || "_______________";
  var ddate = fmtDate(document.getElementById("ddate").value);
  var cdate = fmtDate(document.getElementById("cdate").value);
  var a = parseFloat(document.getElementById("asset").value) || 0;
  var fee = parseFloat(document.getElementById("fee").value) || 0;
  var feeStr = fee > 0 ? comma(fee) + "만원" : "______________원";
  var feeVat = fee > 0 ? comma(fee*1.1) + "만원" : "______________원";
  var small = (a > 0 && a <= 10 && baseFee(a) !== null);
  var chk1 = small ? "☑" : "☐", chk2 = small ? "☐" : "☑";
  function pay(pct){ return fee > 0 ? " — 금 " + comma(fee*1.1*pct) + "만원(부가세 포함)" : ""; }

  var payRows = small
    ? '<tr><td>착수금 50%</td><td>위임계약 체결 시</td><td>' + (fee>0? comma(fee*1.1*0.5)+"만원":"") + '</td></tr>' +
      '<tr><td>잔금 50%</td><td>상속세 신고서 접수(접수증 교부) 시</td><td>' + (fee>0? comma(fee*1.1*0.5)+"만원":"") + '</td></tr>'
    : '<tr><td>착수금 30%</td><td>위임계약 체결 시</td><td>' + (fee>0? comma(fee*1.1*0.3)+"만원":"") + '</td></tr>' +
      '<tr><td>중간금 30%</td><td>재산 확정·세액 초안 보고 시</td><td>' + (fee>0? comma(fee*1.1*0.3)+"만원":"") + '</td></tr>' +
      '<tr><td>잔금 40%</td><td>상속세 신고서 접수(접수증 교부) 시</td><td>' + (fee>0? comma(fee*1.1*0.4)+"만원":"") + '</td></tr>';

  var scope = ["상속재산 조회·파악 — 안심상속 원스톱서비스·금융감독원 상속인 금융거래조회 안내 및 결과 정리, 상속재산 목록 작성",
    "피상속인의 10년간 금융거래내역 분석 (사전증여·추정상속재산 사전 검토)",
    "상속재산 평가 — 부동산 평가방법 검토(기준시가·유사매매사례가액·감정평가 활용 전략), 상장주식·금융재산 평가",
    "사전증여재산 합산 검토 및 기납부 증여세액공제 반영",
    "공과금·장례비용·채무의 증빙 검토 및 차감 정리",
    "상속공제 검토·적용 — 배우자상속공제 분할 설계, 1·2차 상속 합산 시뮬레이션 포함",
    "상속재산분할협의에 대한 세무 자문 (협의서 양식 제공, 분할안별 세액 비교)",
    "상속세 과세표준신고서 및 부속서류 작성, 홈택스 전자신고·접수",
    "납부 설계 — 분납·연부연납·물납 검토 및 신청서 작성",
    "세무조사 대비 소명자료 작성 및 신고서 첨부",
    "신고 후 과세관청의 서면 소명자료 요구에 대한 대응 (2회 이내)",
    "상속 취득세 신고 검토 및 등기 담당 법무사와의 업무 연계"];
  var excl = ["피상속인의 사망연도분 종합소득세·부가가치세 확정신고 (별도 보수로 수행)",
    "실지조사(세무조사) 대응 — 제7조에 따라 별도 계약으로 전환",
    "신고 이후의 경정청구 및 수정신고",
    "감정평가 수수료(감정평가사), 상속등기 비용(법무사), 소송 비용(변호사) — 위임인이 각 전문가에게 직접 지급하며, 을은 전문가 연결·일정 조율을 지원한다"];

  var heirs = [];
  document.querySelectorAll("#heirs .heir-row").forEach(function(r){
    var ins = r.querySelectorAll("input");
    heirs.push([esc(ins[0].value), esc(ins[1].value), esc(ins[2].value), esc(ins[3].value)]);
  });
  while (heirs.length < 6) heirs.push(["","","",""]);
  var heirRows = heirs.map(function(h){
    return '<tr style="height:9mm;"><td>'+h[0]+'</td><td style="text-align:center;">'+h[1]+'</td><td style="text-align:center;">'+h[2]+'</td><td>'+h[3]+'</td><td></td></tr>';
  }).join("");

  var html =
  '<div class="pgseg">' +
  '<h1>상속세 신고 업무 위임계약서</h1><div class="csub">원제우세무사사무소</div>' +
  '<table class="pt">' +
  '<tr><td>위임인 (갑)</td><td>대표상속인: <b>' + rep + '</b> &nbsp;(연락처: ' + repTel + ')</td></tr>' +
  '<tr><td></td><td>피상속인: <b>' + dec + '</b> &nbsp;(상속개시일: ' + ddate + ')</td></tr>' +
  '<tr><td></td><td>상속인 전원: 별지 상속인 명단 기재와 같음</td></tr>' +
  '<tr><td>수임인 (을)</td><td>원제우세무사사무소 세무사 원제우 (등록번호 W35563)<br>경기도 부천시 소향로 135, 3층 · 전화 032-321-4521 · taxmancall@gmail.com</td></tr>' +
  '</table>' +
  '<p>위임인(이하 "갑")과 수임인(이하 "을")은 피상속인의 상속세 신고 업무에 관하여 다음과 같이 위임계약을 체결한다.</p>' +

  '<h3>제1조 (위임 업무의 범위)</h3>' +
  '<p>① 을이 수행하는 업무는 다음 각 호와 같다.</p><ol>' +
  scope.map(function(s){return "<li>"+s+"</li>";}).join("") + '</ol>' +
  '<p>② 다음 각 호의 업무는 본 계약의 범위에 포함되지 아니한다.</p><ol>' +
  excl.map(function(s){return "<li>"+s+"</li>";}).join("") + '</ol>' +

  '<h3>제2조 (보수)</h3>' +
  '<p>① 본 계약의 보수는 금 <b>' + feeStr + '</b>(부가가치세 별도, 부가가치세 포함 금 <b>' + feeVat + '</b>)으로 한다. 보수의 산정 기준은 별지 「상속세 신고·조사 대응 보수 기준표」에 따른다.</p>' +
  '<p>② 재산 내역 확인 과정에서 별지 기준표의 가산 항목(비상장주식 평가, 해외재산, 가업·영농상속공제 적용 등)에 해당하는 사정이 새로 확인되는 경우, 갑과 을은 협의하여 보수를 조정하고 서면(문자·전자우편 포함)으로 확인한다.</p>' +

  '<h3>제3조 (보수의 지급)</h3>' +
  '<p>① 갑은 보수를 다음과 같이 지급한다.</p>' +
  '<p style="margin-left:14px;">' + chk1 + ' 총상속재산가액 10억원 이하: 착수금 50% + 잔금 50%<br>' + chk2 + ' 총상속재산가액 10억원 초과: 착수금 30% + 중간금 30% + 잔금 40%</p>' +
  '<table><tr><th>구분</th><th>지급 시기</th><th>금액 (부가세 포함)</th></tr>' + payRows + '</table>' +
  '<p>② 잔금의 지급 시기는 상속세 과세표준신고서의 접수(접수증 교부)가 완료된 때로 한다.</p>' +
  '<div class="acct">③ 입금 계좌: 하나은행 010-3489-4567 (평생계좌, 예금주: 원제우세무사)</div>' +
  '<p>④ 보수는 상속인 전원이 연대하여 지급할 의무를 진다. 갑은 상속인 전원을 대표하여 본 계약을 체결하며, 별지 상속인 명단의 서명으로 이를 확인한다.</p>' +

  '<h3>제4조 (갑의 의무 — 자료 제공과 진실성)</h3>' +
  '<p>① 갑은 상속재산·채무·사전증여 등 신고에 필요한 자료와 정보를 지체 없이, 사실대로 제공하여야 한다.</p>' +
  '<p>② 갑이 제공하지 않았거나 사실과 다르게 제공한 자료·정보로 인하여 발생하는 가산세, 추징세액 및 그 밖의 불이익은 갑의 부담으로 한다.</p>' +

  '<h3>제5조 (을의 의무)</h3>' +
  '<p>① 을은 세무사법 및 관계 법령을 준수하여 선량한 관리자의 주의로 위임 업무를 수행한다.</p>' +
  '<p>② 을은 업무 수행 중 알게 된 갑과 피상속인의 비밀을 정당한 사유 없이 누설하지 아니한다.</p>' +

  '<h3>제6조 (계약의 해지와 정산)</h3>' +
  '<p>① 갑 또는 을은 상대방에 대한 서면 통지로 본 계약을 해지할 수 있다.</p>' +
